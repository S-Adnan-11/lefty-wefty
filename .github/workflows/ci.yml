name: Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.4.12'
          bundler: '2.6.9'
          bundler-cache: true
      - name: Install native tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          sudo install -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-18
      - name: Build the S3-compatible fixture from pinned public source
        run: bundle exec ruby script/ci/build_objects.rb
      - name: Prepare isolated PostgreSQL and object storage
        run: bundle exec ruby script/ci/prepare.rb
      - name: Verify schema creation, SQL restoration and upgrade
        run: bundle exec ruby script/ci/schema.rb
      - name: Build the production image without runtime credentials
        run: docker build --tag lefty-wefty-ci .
      - name: Run regression, concurrency, style and security checks with pinned native dependencies
        run: |
          docker build --target verification --tag lefty-wefty-checks .
          docker run --rm --network "$LEFTY_WEFTY_CI_NETWORK" --env-file "$LEFTY_WEFTY_CI_DIRECTORY/regression.env" --volume "$LEFTY_WEFTY_CI_DIRECTORY:/ci:ro" lefty-wefty-checks bundle exec ruby bin/ci
      - name: Verify production startup, TLS, storage, restart and migration failure
        run: bundle exec ruby script/ci/production.rb
