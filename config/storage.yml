<% local_path = Rails.root.join("config/uploads.local.yml") %>
<% local = local_path.exist? ? YAML.safe_load_file(local_path) : {} %>
local:
  service: Disk
  root: <%= ENV.fetch("LEFTY_WEFTY_UPLOAD_ROOT", local.fetch("root", Rails.root.join("storage").to_s)).to_json %>
test:
  service: Disk
  root: <%= Rails.root.join("tmp/test-uploads").to_s.to_json %>
s3:
  service: S3
  endpoint: <%= ENV["LEFTY_WEFTY_S3_ENDPOINT"].to_json %>
  region: <%= ENV["LEFTY_WEFTY_S3_REGION"].to_json %>
  bucket: <%= ENV["LEFTY_WEFTY_S3_BUCKET"].to_json %>
  access_key_id: <%= ENV["LEFTY_WEFTY_S3_ACCESS_KEY_ID"].to_json %>
  secret_access_key: <%= ENV["LEFTY_WEFTY_S3_SECRET_ACCESS_KEY"].to_json %>
  force_path_style: true
  public: false
  ssl_verify_peer: true
  <% if ENV["LEFTY_WEFTY_S3_CA_BUNDLE"].present? %>
  ssl_ca_bundle: <%= ENV["LEFTY_WEFTY_S3_CA_BUNDLE"].to_json %>
  <% end %>
  retry_limit: 1
  http_open_timeout: 3
  http_read_timeout: 5
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
